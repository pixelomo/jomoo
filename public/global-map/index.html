<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOMOOのグローバル展開</title>
<style>
  :root{ --paper:#ffffff; --ink:#15384f; --grey:#7fa6bd; --hair:#35b4ee; }
  body.inv{ --paper:#050d18; --ink:#d3ecfa; --grey:#5d87a3; --hair:#d3ecfa; }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
    transition:background-color .25s linear, color .25s linear;
  }
  #stage{position:fixed; inset:0}
  #fallback{display:none; position:fixed; inset:0; width:100%; height:100%; object-fit:contain}
  #stage canvas{display:block; touch-action:auto}
  #labels{position:fixed; inset:0; pointer-events:none}

  .lbl{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform;
    white-space:nowrap; color:var(--ink); font-size:11.5px; font-weight:500;
    padding-left:12px; margin:-7px 0 0 1px;
    transition:opacity .2s linear, color .15s linear;}
  .lbl.hub{font-size:14px; font-weight:600; letter-spacing:.09em; padding-left:20px; margin-top:-24px;}
  .lbl.flip{padding:0 12px 0 0; text-align:right}
  .lbl.hub.flip{padding-right:20px}
  .lbl.dim{opacity:.2}
  .lbl.on{text-decoration:underline; text-underline-offset:3px}

  .head{position:fixed; left:28px; top:26px; max-width:26ch}
  .head h1{margin:0; font-size:16px; font-weight:600; letter-spacing:-.01em}
  .head p{margin:5px 0 0; color:var(--grey)}

  .head,#labels{opacity:0; transition:opacity .7s ease .2s}
  body.ready .head, body.ready #labels{opacity:1}

  @media (max-width:820px){
    .head{left:16px; top:14px}
    .lbl{font-size:10.5px} .lbl.hub{font-size:12px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<img id="fallback" src="/images/companyprofile/mapprof.jpg" alt="">
<script>
  /* A browser without WebGL, or any failure while the scene builds itself,
     leaves this panel blank white — so the flat map the scene replaced is kept
     here and swapped in on the first error. */
  window.addEventListener('error', function () {
    var f = document.getElementById('fallback');
    if (!f || f.dataset.shown) return;
    f.dataset.shown = '1';
    f.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
    document.getElementById('labels').style.display = 'none';
  });
</script>
<noscript><style>#fallback{display:block}</style></noscript>

      uniforms: Object.assign({

        uColor: { value: C(INK.ink) }, uOpacity: { value: 1 }
      }, opts.uniforms || {}),
      transparent: true, depthWrite: opts.depthWrite !== false,
      polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6,
      vertexShader: [
        'attribute vec3 aOther; attribute float aSide, aSide2;',
        opts.extraAttribs || '',
        'uniform vec2 uRes; uniform float uWidth;',
        'varying float vSide, vAlong, vLen;',
        opts.extraVarying || '',
        'void main(){',
        ' vSide = aSide;',
        opts.vertexBody || '',
        ' vec4 c0 = projectionMatrix*modelViewMatrix*vec4(position,1.0);',
        ' vec4 c1 = projectionMatrix*modelViewMatrix*vec4(aOther,1.0);',
        ' vec2 s0 = c0.xy/max(c0.w,0.0001)*uRes*0.5;',
        ' vec2 s1 = c1.xy/max(c1.w,0.0001)*uRes*0.5;',
        ' vec2 dir = s1-s0; float L = length(dir);',
        ' dir = L > 0.0001 ? dir/L : vec2(1.0,0.0);',
        ' vec2 nrm = vec2(-dir.y, dir.x);',
        ' vLen = L / max(uWidth*0.5, 0.001);',
        ' vAlong = aSide2 > 0.5 ? vLen + 1.0 : -1.0;',
        ' vec2 off = (nrm*aSide - dir)*uWidth*0.5;',
        ' c0.xy += off*(2.0/uRes)*c0.w;',
        ' gl_Position = c0;',
        '}'
      ].join('\n'),
      fragmentShader: opts.fragmentShader || [
        'precision highp float; uniform vec3 uColor; uniform float uOpacity;',
        'varying float vSide, vAlong, vLen;',
        'float lineD(){ float t = clamp(vAlong, 0.0, vLen); return length(vec2(vAlong - t, vSide)); }',
        'void main(){ float soft = smoothstep(1.0, 0.25, lineD());',
        ' gl_FragColor = vec4(uColor, uOpacity*soft); }'
      ].join('\n')
    });
  }

  // segments: flat array of [ax,ay,az,bx,by,bz]; extras: {name:{size, valuesPerSegment(fn)}}
  function fatLineGeometry(segs, extras) {
    const n = segs.length / 6;
    const position = new Float32Array(n * 4 * 3);
    const other = new Float32Array(n * 4 * 3);
    const side = new Float32Array(n * 4);
    const side2 = new Float32Array(n * 4);
    const index = new Uint32Array(n * 6);
    const ex = {};
    if (extras) Object.keys(extras).forEach(function (k) { ex[k] = new Float32Array(n * 4 * extras[k].size); });
    for (let s = 0; s < n; s++) {
      const a = [segs[s * 6], segs[s * 6 + 1], segs[s * 6 + 2]];
      const b = [segs[s * 6 + 3], segs[s * 6 + 4], segs[s * 6 + 5]];
      const self = [a, a, b, b], oth = [b, b, a, a], sd = [-1, 1, 1, -1];
      for (let v = 0; v < 4; v++) {
        const o = (s * 4 + v) * 3;
        position[o] = self[v][0]; position[o + 1] = self[v][1]; position[o + 2] = self[v][2];
        other[o] = oth[v][0]; other[o + 1] = oth[v][1]; other[o + 2] = oth[v][2];
        side[s * 4 + v] = sd[v];
        side2[s * 4 + v] = v < 2 ? 0 : 1;
      }
      const i = s * 6, q = s * 4;
      index[i] = q; index[i + 1] = q + 1; index[i + 2] = q + 2;
      index[i + 3] = q; index[i + 4] = q + 2; index[i + 5] = q + 3;
    }
    const g = new THREE.BufferGeometry();
    g.setIndex(new THREE.BufferAttribute(index, 1));
    g.setAttribute('position', new THREE.BufferAttribute(position, 3));
    g.setAttribute('aOther', new THREE.BufferAttribute(other, 3));
    g.setAttribute('aSide', new THREE.BufferAttribute(side, 1));
    g.setAttribute('aSide2', new THREE.BufferAttribute(side2, 1));
    Object.keys(ex).forEach(function (k) {
      g.setAttribute(k, new THREE.BufferAttribute(ex[k], extras[k].size));
    });
    return g;
  }

  /* ----------------------------------------------------------------- land */

  const world = window.__WORLD__;
  const countryNames = [];
  const bounds = { minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9 };

  const capsMat = new THREE.ShaderMaterial({
    uniforms: {
      uPaper: { value: C(INK.paper) }, uHover: { value: -1 },
      uHoverTint: { value: C(0xdcdcdc) }, uDeep: { value: C(INK.wallLow) }
    },
    vertexShader: [
      'attribute float cid; varying float vCid; varying vec3 vN;',
      'void main(){ vCid=cid; vN=normal;',
      ' gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'precision highp float; uniform vec3 uPaper,uHoverTint,uDeep; uniform float uHover;',
      'varying float vCid; varying vec3 vN;',
      'void main(){',
      ' vec3 col = vN.y < 0.0 ? uDeep : uPaper;',
      ' float hv = 1.0 - step(0.5, abs(vCid-uHover));',
      ' col = mix(col, uHoverTint, hv);',
      ' gl_FragColor = vec4(col,1.0);',
      '}'
    ].join('\n')
  });

  // two flat cel bands down the extruded wall
  const wallsMat = new THREE.ShaderMaterial({
    uniforms: {
      uHi: { value: C(INK.wall) }, uLo: { value: C(INK.wallLow) },
      uDepth: { value: DEPTH }, uHover: { value: -1 }, uHoverTint: { value: C(0xc6c6c6) }
    },
    vertexShader: [
      'attribute float cid; varying float vY; varying float vCid;',
      'void main(){ vY=position.y; vCid=cid;',
      ' gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'precision highp float; uniform vec3 uHi,uLo,uHoverTint; uniform float uDepth,uHover;',
      'varying float vY; varying float vCid;',
      'void main(){',
      ' float h = clamp(vY/uDepth,0.0,1.0);',
      ' vec3 col = h > 0.42 ? uHi : uLo;',
      ' float hv = 1.0 - step(0.5, abs(vCid-uHover));',
      ' col = mix(col, uHoverTint, hv);',
      ' gl_FragColor = vec4(col,1.0);',
      '}'
    ].join('\n')
  });

  let capsMesh;
  const underMat = fatLineMaterial({
    depthWrite: false,
    uniforms: { uTime: { value: 0 }, uPulse: { value: 1 } },
    fragmentShader: [
      'precision highp float;',
      'uniform vec3 uColor; uniform float uOpacity,uTime,uPulse;',
      'varying float vSide, vAlong, vLen;',
      'float lineD(){ float t = clamp(vAlong, 0.0, vLen); return length(vec2(vAlong - t, vSide)); }',
      'void main(){',
      ' float across = pow(1.0 - min(lineD(), 1.0), 2.0);',
      ' float breathe = 0.78 + 0.22*sin(uTime*0.55)*uPulse;',
      ' gl_FragColor = vec4(uColor, across*uOpacity*breathe);',
      '}'
    ].join('\n')
  });
  underMat.uniforms.uWidth.value = 17.0;

  const topInkMat = fatLineMaterial({});
  const baseInkMat = fatLineMaterial({});
  topInkMat.uniforms.uWidth.value = 2.0;
  baseInkMat.uniforms.uWidth.value = 1.6;
  baseInkMat.uniforms.uOpacity.value = 0.55;

  const shearM = new THREE.Matrix4().set(
    1, 0, 0, 0,
    0, 1, 0, 0,
    0, -SHEAR / DEPTH, 1, SHEAR,
    0, 0, 0, 1);

  (function buildLand() {
    const cp = [], cn = [], cc = [], wp = [], wn = [], wc = [];
    const topSeg = [], baseSeg = [];

    world.c.forEach(function (country, ci) {
      countryNames.push(country.n);
      const polys = []; let cur = null;
      country.p.forEach(function (s) {
        const pts = chaikin(decodePolyline(s.slice(1)).map(function (p) {
          return [p[0], mercY(p[1])];
        }), 2);
        if (s[0] === 'h' && cur) cur.holes.push(pts);
        else { cur = { outer: pts, holes: [] }; polys.push(cur); }
      });
      polys.forEach(function (poly) {
        const shape = new THREE.Shape(poly.outer.map(function (p) { return new THREE.Vector2(p[0], p[1]); }));
        poly.holes.forEach(function (h) {
          shape.holes.push(new THREE.Path(h.map(function (p) { return new THREE.Vector2(p[0], p[1]); })));
        });
        let geo;
        try { geo = new THREE.ExtrudeGeometry(shape, { depth: DEPTH, bevelEnabled: false, curveSegments: 1, steps: 1 }); }
        catch (e) { return; }
        geo.rotateX(-Math.PI / 2);
        geo.applyMatrix4(shearM);
        const pos = geo.attributes.position.array, nor = geo.attributes.normal.array;
        geo.groups.forEach(function (g) {
          const dp = g.materialIndex === 0 ? cp : wp, dn = g.materialIndex === 0 ? cn : wn,
            dc = g.materialIndex === 0 ? cc : wc;
          for (let v = g.start; v < g.start + g.count; v++) {
            dp.push(pos[v * 3], pos[v * 3 + 1], pos[v * 3 + 2]);
            dn.push(nor[v * 3], nor[v * 3 + 1], nor[v * 3 + 2]);
            dc.push(ci);
          }
        });
        geo.dispose();
        [poly.outer].concat(poly.holes).forEach(function (r) {
          for (let i = 0; i < r.length; i++) {
            const a = r[i], b = r[(i + 1) % r.length];
            if (a[0] < bounds.minX) bounds.minX = a[0];
            if (a[0] > bounds.maxX) bounds.maxX = a[0];
            if (-a[1] < bounds.minZ) bounds.minZ = -a[1];
            if (-a[1] + SHEAR > bounds.maxZ) bounds.maxZ = -a[1] + SHEAR;
            topSeg.push(a[0], DEPTH + 0.03, -a[1], b[0], DEPTH + 0.03, -b[1]);
            baseSeg.push(a[0], 0, -a[1] + SHEAR, b[0], 0, -b[1] + SHEAR);
          }
        });
      });
    });

    function mk(p, n, c) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(n, 3));
      g.setAttribute('cid', new THREE.Float32BufferAttribute(c, 1));
      return g;
    }
    capsMesh = new THREE.Mesh(mk(cp, cn, cc), capsMat);
    scene.add(capsMesh, new THREE.Mesh(mk(wp, wn, wc), wallsMat));

    const baseGeo = fatLineGeometry(baseSeg);
    const under = new THREE.Mesh(baseGeo, underMat);
    under.renderOrder = 1;
    scene.add(under);

    const baseInk = new THREE.Mesh(baseGeo, baseInkMat);
    const topInk = new THREE.Mesh(fatLineGeometry(topSeg), topInkMat);
    baseInk.renderOrder = 2; topInk.renderOrder = 3;
    scene.add(baseInk, topInk);
  })();

  /* --------------------------------------------------------------- places */

  const markers = HUBS.map(function (h) {
    return { id: h.id, label: h.label, full: h.full, lon: h.lon, lat: h.lat, kind: 'hub', links: [] };
  }).concat(NODES.map(function (n) {
    return { id: n[0], label: n[0], lon: n[1], lat: n[2], kind: 'node', links: [] };
  })).concat(RELAYS.map(function (r) {
    return { id: r[0], label: '', lon: r[1], lat: r[2], kind: 'relay', links: [] };
  }));
  const byId = {};
  markers.forEach(function (m, i) {
    m.index = i; byId[m.id] = m;
    m.pos = new THREE.Vector3(m.lon, DEPTH + 0.4, -mercY(m.lat));
  });

  const routes = [];
  Object.keys(LANES).forEach(function (hub) {
    LANES[hub].forEach(function (dst) {
      const a = byId[hub], b = byId[dst];
      if (!a || !b) return;
      routes.push({ a: a, b: b, hubs: [hub] });
      a.links.push(b); b.links.push(a);
    });
  });
  TRUNKS.forEach(function (t) {
    const a = byId[t[0]], b = byId[t[1]];
    routes.push({ a: a, b: b, hubs: [t[0], t[1]], trunk: true });
    a.links.push(b); b.links.push(a);
  });

  /* ----------------------------------------------------------------- lanes */

  function laneShader(glow) {
    const m = fatLineMaterial({
      depthWrite: false,
      uniforms: {
        uTime: { value: 0 }, uSpeed: { value: 0.15 }, uFlow: { value: 1 },
        uGhost: { value: C(INK.ghost) }, uInk: { value: C(INK.ink) },
        uHot: { value: C(INK.hot) }, uGlowA: { value: INK.glowA }
      },
      extraAttribs: 'attribute float aT,aSeed,aActive,aHot;',
      extraVarying: 'varying float vT,vSeed,vActive,vHot;',
      vertexBody: ' vT=aT; vSeed=aSeed; vActive=aActive; vHot=aHot;',
      fragmentShader: [
        'precision highp float;',
        'uniform vec3 uGhost,uInk,uHot; uniform float uTime,uSpeed,uFlow,uGlowA;',
        'varying float vT,vSeed,vActive,vHot,vSide,vAlong,vLen;',
        'float lineD(){ float t = clamp(vAlong, 0.0, vLen); return length(vec2(vAlong - t, vSide)); }',
        'void main(){',
        ' float ends = smoothstep(0.0,0.03,vT)*smoothstep(1.0,0.97,vT);',
        ' float head = fract(uTime*uSpeed + vSeed);',
        ' float behind = head - vT;',
        ' float dash = (behind > 0.0 && behind < 0.13) ? 1.0 - behind/0.13*0.35 : 0.0;',
        ' float trail = (behind > 0.0 && behind < 0.30) ? exp(-behind*9.0) : 0.0;',
        ' dash = max(dash*uFlow, trail*uFlow*0.6);',
        ' float dim = mix(0.10, 1.0, vActive);',
        glow
          ? [' float across = pow(1.0 - min(lineD(), 1.0), 2.2);',
             ' vec3 col = mix(uHot, uInk, 0.25);',
             ' float a = across * uGlowA * (0.45 + dash*1.5 + vHot*0.8) * ends * dim;'].join('\n')
          : [' vec3 base = mix(uGhost, uHot, vHot*0.7);',
             ' vec3 col = mix(base, uInk, dash);',
             ' float soft = smoothstep(1.0, 0.25, lineD());',
             ' float a = (0.5 + vHot*0.3 + dash*0.5) * ends * dim * soft;'].join('\n'),
        ' gl_FragColor = vec4(col, clamp(a,0.0,1.0));',
        '}'
      ].join('\n')
    });
    m.uniforms.uWidth.value = glow ? 6.0 : 1.35;
    return m;
  }
  const laneMat = laneShader(false);
  const laneGlowMat = laneShader(true);

  let laneGeo;
  (function buildLanes() {
    const segs = [], tPer = [], seedPer = [];
    routes.forEach(function (r, ri) {
      const A = r.a.pos.clone(), B = r.b.pos.clone();
      const dist = A.distanceTo(B);
      const dir = new THREE.Vector3().subVectors(B, A).normalize();
      const perp = new THREE.Vector3(-dir.z, 0, dir.x);
      if (perp.z > 0) perp.negate();
      const mid = A.clone().add(B).multiplyScalar(0.5).add(perp.multiplyScalar(dist * 0.09));
      mid.y += 1.5 + dist * 0.07;
      const pts = new THREE.QuadraticBezierCurve3(A, mid, B).getPoints(SEG);
      const seed = (ri * 0.6180339887) % 1;
      r.segStart = segs.length / 6;
      for (let i = 0; i < SEG; i++) {
        segs.push(pts[i].x, pts[i].y, pts[i].z, pts[i + 1].x, pts[i + 1].y, pts[i + 1].z);
        tPer.push(i / SEG, (i + 1) / SEG); seedPer.push(seed);
      }
      r.segCount = SEG;
    });
    laneGeo = fatLineGeometry(segs, {
      aT: { size: 1 }, aSeed: { size: 1 }, aActive: { size: 1 }, aHot: { size: 1 }
    });
    const aT = laneGeo.attributes.aT.array, aS = laneGeo.attributes.aSeed.array,
      aA = laneGeo.attributes.aActive.array;
    for (let s = 0; s < segs.length / 6; s++) {
      const t0 = tPer[s * 2], t1 = tPer[s * 2 + 1];
      aT[s * 4] = t0; aT[s * 4 + 1] = t0; aT[s * 4 + 2] = t1; aT[s * 4 + 3] = t1;
      for (let v = 0; v < 4; v++) { aS[s * 4 + v] = seedPer[s]; aA[s * 4 + v] = 1; }
    }
    const glow = new THREE.Mesh(laneGeo, laneGlowMat);
    glow.renderOrder = 5;
    const lanes = new THREE.Mesh(laneGeo, laneMat);
    lanes.renderOrder = 6;
    scene.add(glow, lanes);
  })();

  /* --------------------------------------------------------------- markers */

  const markerMat = new THREE.ShaderMaterial({
    uniforms: {
      uRes: { value: RES }, uTime: { value: 0 }, uFlow: { value: 1 },
      uInk: { value: C(INK.ink) }, uPaper: { value: C(INK.paper) }
    },
    transparent: true, depthWrite: false, depthTest: false,
    extensions: { derivatives: true },
    vertexShader: [
      'attribute vec2 aCorner; attribute float aSize,aPhase,aKind,aActive,aHot;',
      'uniform vec2 uRes;',
      'varying vec2 vC; varying float vPhase,vKind,vActive,vHot;',
      'void main(){ vC=aCorner; vPhase=aPhase; vKind=aKind; vActive=aActive; vHot=aHot;',
      ' vec4 c = projectionMatrix*modelViewMatrix*vec4(position,1.0);',
      ' c.xy += aCorner*aSize*(2.0/uRes)*c.w;',
      ' gl_Position = c; }'
    ].join('\n'),
    fragmentShader: [
      'precision highp float;',
      'uniform vec3 uInk,uPaper; uniform float uTime,uFlow;',
      'varying vec2 vC; varying float vPhase,vKind,vActive,vHot;',
      'void main(){',
      ' float r = length(vC);',
      ' float aa = fwidth(r)*1.2;',
      ' float hub = step(0.5, vKind);',
      ' float relay = 1.0 - step(-0.5, vKind);',     // kind: -1 relay, 0 node, 1 hub
      ' float R  = mix(0.34, 0.46, hub);',
      ' float th = mix(0.075, 0.10, hub) + vHot*0.02;',
      ' float disc = 1.0 - smoothstep(R-aa, R+aa, r);',
      ' float ring = disc * smoothstep(R-th-aa, R-th+aa, r);',
      ' float core = hub * (1.0 - smoothstep(0.16-aa, 0.16+aa, r));',
      ' core += relay * (1.0 - smoothstep(0.12-aa, 0.12+aa, r));',
      ' float t = fract(uTime*0.24 + vPhase);',
      ' float pr = mix(R, 0.95, t);',
      ' float pulse = (1.0-smoothstep(pr-aa,pr+aa,r)) * smoothstep(pr-0.06-aa,pr-0.02,r)',
      '   * (1.0-t) * (0.35+hub*0.35) * uFlow;',
      ' float fill = disc - ring - core;',
      ' vec3 col = uInk;',
      ' float a = clamp(ring + core + pulse + vHot*0.15, 0.0, 1.0);',
      ' vec4 base = vec4(uPaper, clamp(fill,0.0,1.0));',
      ' vec4 outp = vec4(mix(base.rgb, col, min(a,1.0)), clamp(base.a + a, 0.0, 1.0));',
      ' outp.a *= mix(0.16, 1.0, vActive);',
      ' if (outp.a < 0.005) discard;',
      ' gl_FragColor = outp;',
      '}'
    ].join('\n')
  });

  const markerGeo = new THREE.BufferGeometry();
  (function buildMarkers() {
    const pos = [], corner = [], size = [], phase = [], kind = [], active = [], hot = [], idx = [];
    const cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    markers.forEach(function (m, i) {
      const s = m.kind === 'hub' ? 34 : m.kind === 'node' ? 19 : 13;
      for (let k = 0; k < 4; k++) {
        pos.push(m.pos.x, m.pos.y, m.pos.z);
        corner.push(cs[k][0], cs[k][1]);
        size.push(s); phase.push((i * 0.31) % 1);
        kind.push(m.kind === 'hub' ? 1 : m.kind === 'node' ? 0 : -1);
        active.push(1); hot.push(0);
      }
      idx.push(i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3);
    });
    markerGeo.setIndex(idx);
    markerGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    markerGeo.setAttribute('aCorner', new THREE.Float32BufferAttribute(corner, 2));
    markerGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(size, 1));
    markerGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phase, 1));
    markerGeo.setAttribute('aKind', new THREE.Float32BufferAttribute(kind, 1));
    markerGeo.setAttribute('aActive', new THREE.Float32BufferAttribute(active, 1));
    markerGeo.setAttribute('aHot', new THREE.Float32BufferAttribute(hot, 1));
    const mesh = new THREE.Mesh(markerGeo, markerMat);
    mesh.renderOrder = 8;
    mesh.frustumCulled = false;
    scene.add(mesh);
  })();

  /* ---------------------------------------------------------------- labels */

  const labelLayer = document.getElementById('labels');
  markers.forEach(function (m) {
    if (!m.label) return;
    const el = document.createElement('div');
    el.className = 'lbl' + (m.kind === 'hub' ? ' hub' : '');
    el.textContent = m.label;
    labelLayer.appendChild(el);
    m.el = el;
  });

  /* ----------------------------------------------------------- highlighting */

  function setLane(name, fn) {
    const arr = laneGeo.attributes[name].array;
    routes.forEach(function (r) {
      const v = fn(r);
      for (let i = 0; i < r.segCount * 4; i++) arr[r.segStart * 4 + i] = v;
    });
    laneGeo.attributes[name].needsUpdate = true;
  }
  function setMarker(name, fn) {
    const arr = markerGeo.attributes[name].array;
    markers.forEach(function (m, i) {
      const v = fn(m);
      for (let k = 0; k < 4; k++) arr[i * 4 + k] = v;
    });
    markerGeo.attributes[name].needsUpdate = true;
  }

  function refresh() {
    const focus = state.focus;
    const hv = state.hover != null ? markers[state.hover] : null;
    setLane('aActive', function (r) { return !focus || r.hubs.indexOf(focus) >= 0 ? 1 : 0; });
    setLane('aHot', function (r) { return hv && (r.a === hv || r.b === hv) ? 1 : 0; });

    const live = {};
    if (focus) {
      live[focus] = 1;
      routes.forEach(function (r) {
        if (r.hubs.indexOf(focus) >= 0) { live[r.a.id] = 1; live[r.b.id] = 1; }
      });
    }
    setMarker('aActive', function (m) { return focus ? (live[m.id] ? 1 : 0) : 1; });
    setMarker('aHot', function (m) { return hv && (m === hv || hv.links.indexOf(m) >= 0) ? 1 : 0; });

    markers.forEach(function (m) {
      if (!m.el) return;
      m.el.classList.toggle('dim', !!(focus && !live[m.id]));
      m.el.classList.toggle('on', hv === m);
    });
    document.querySelectorAll('.chip').forEach(function (c) {
      c.classList.toggle('sel', (c.dataset.hub || null) === (focus || null));
    });
    readout();
  }

  function readout() {
    const d = document.getElementById('detail');
    if (!d) return;
    const hv = state.hover != null ? markers[state.hover] : null;
    if (hv && hv.kind !== 'relay') {
      const names = hv.links.filter(function (l) { return l.kind !== 'relay'; })
        .map(function (l) { return l.kind === 'hub' ? l.label : l.label; });
      d.innerHTML = '<b>' + (hv.kind === 'hub' ? hv.full : hv.label) + '</b><span>' +
        (hv.kind === 'hub' ? hv.links.length + ' lanes' : 'Served from ' + names.join(', ')) + '</span>';
      return;
    }
    if (hv && hv.kind === 'relay') {
      d.innerHTML = '<b>Relay point</b><span>Unnamed stop on the ' +
        (hv.links[0] ? hv.links[0].label : '') + ' fan.</span>';
      return;
    }
    if (state.focus) {
      const h = byId[state.focus];
      const named = (LANES[state.focus] || []).filter(function (n) { return n.indexOf('r-') !== 0; });
      d.innerHTML = '<b>' + h.full + '</b><span>' + (named.length ? named.join(', ') : 'Relay lanes only') + '</span>';
      return;
    }
    if (state.hoverCountry >= 0) {
      d.innerHTML = '<b>' + countryNames[state.hoverCountry] + '</b><span>Hover a marker to trace its lanes.</span>';
      return;
    }
    d.innerHTML = '<b>' + HUBS.length + ' hubs, ' + NODES.length + ' markets</b>' +
      '<span>Hover to trace a lane, click a hub to isolate it. Scroll to zoom, drag to pan.</span>';
  }

  /* --------------------------------------------------------------- pointer */

  const canvas = renderer.domElement;
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const screen = markers.map(function () { return { x: 0, y: 0, vis: false }; });
  const pointers = new Map();
  let drag = null, moved = 0, pinch = 0, lastPick = 0;

  /* Embedded, the map hovers and it takes a click on a hub — it does not pan,
     zoom or pinch. Those fought the page: the wheel was captured with
     preventDefault, so scrolling over the map stopped scrolling the page, and
     the pan did not survive the frame anyway because the parent claims the
     gesture and this document gets a pointercancel. What is kept here is the
     press/release bookkeeping, because that is what tells a click from a drag. */
  canvas.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    moved = 0;
  });
  function release(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = 0;
    if (drag && drag.id === e.pointerId) {
      if (moved < 5) click();
      drag = null;
    }
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  canvas.addEventListener('pointermove', function (e) {
    const rect = canvas.getBoundingClientRect();
    if (pointers.has(e.pointerId)) {
      const p = pointers.get(e.pointerId); p.x = e.clientX; p.y = e.clientY;
    }
    if (drag) {
      /* Still counted, so a press that travels is not read as a click. */
      moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
      drag.x = e.clientX; drag.y = e.clientY;
    }
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    pick(e.clientX - rect.left, e.clientY - rect.top);
  });
  canvas.addEventListener('pointerleave', function () {
    if (state.hover != null || state.hoverCountry >= 0) {
      state.hover = null; state.hoverCountry = -1;
      capsMat.uniforms.uHover.value = -1; wallsMat.uniforms.uHover.value = -1;
      refresh();
    }
  });
  canvas.addEventListener('dblclick', reset);

  function pick(cx, cy) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < markers.length; i++) {
      const s = screen[i];
      if (!s.vis) continue;
      const rr = markers[i].kind === 'hub' ? 26 * 26 : 18 * 18;
      const d = (s.x - cx) * (s.x - cx) + (s.y - cy) * (s.y - cy);
      if (d < rr && d < bestD) { bestD = d; best = i; }
    }
    let cid = state.hoverCountry;
    const nowMs = performance.now();
    if (best >= 0) cid = -1;
    else if (nowMs - lastPick > 70) {
      lastPick = nowMs;
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObject(capsMesh, false)[0];
      cid = (hit && hit.face) ? capsMesh.geometry.attributes.cid.array[hit.face.a] : -1;
    }
    if (best !== state.hover || cid !== state.hoverCountry) {
      state.hover = best >= 0 ? best : null;
      state.hoverCountry = cid;
      capsMat.uniforms.uHover.value = cid;
      wallsMat.uniforms.uHover.value = cid;
      canvas.style.cursor = best >= 0 ? 'pointer' : '';
      refresh();
    }
  }

  function click() {
    if (state.hover == null) { if (state.focus) focusHub(null); return; }
    const m = markers[state.hover];
    if (m.kind === 'hub') focusHub(state.focus === m.id ? null : m.id);
  }
  function focusHub(id) {
    state.focus = id;
    if (id) {
      const h = byId[id];
      view.ttarget.set(h.pos.x * 0.8, 0, h.pos.z * 0.8 + MAP_MID_Z * 0.2);
      view.tr = view.fit * 0.55;
    } else {
      view.ttarget.set(MAP_MID_X, 0, MAP_MID_Z);
      view.tr = view.fit;
    }
    refresh();
  }
  function reset() { focusHub(null); }

  /* -------------------------------------------------------------------- UI */

  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { focusHub(c.dataset.hub || null); });
  });
  const toggles = {
    motion: function (on) {
      state.motion = on;
      laneMat.uniforms.uFlow.value = on ? 1 : 0;
      laneGlowMat.uniforms.uFlow.value = on ? 1 : 0;
      underMat.uniforms.uPulse.value = on ? 1 : 0;
      markerMat.uniforms.uFlow.value = on ? 1 : 0;
    },
    labels: function (on) { state.labels = on; labelLayer.style.display = on ? '' : 'none'; },
    invert: function (on) { state.manual = true; setNight(on); }
  };
  document.querySelectorAll('.tog').forEach(function (t) {
    t.addEventListener('click', function () {
      const on = !t.classList.contains('on');
      t.classList.toggle('on', on);
      t.setAttribute('aria-pressed', String(on));
      toggles[t.dataset.tog](on);
    });
    if (t.dataset.tog === 'motion' && !state.motion) {
      t.classList.remove('on'); t.setAttribute('aria-pressed', 'false'); toggles.motion(false);
    }
  });

  function paint() {
    const p = P();
    document.body.classList.toggle('inv', state.inverted);
    capsMat.uniforms.uPaper.value.set(p.land);
    capsMat.uniforms.uDeep.value.set(p.wallLow);
    capsMat.uniforms.uHoverTint.value.set(p.hoverCap);
    wallsMat.uniforms.uHi.value.set(p.wall);
    wallsMat.uniforms.uLo.value.set(p.wallLow);
    wallsMat.uniforms.uHoverTint.value.set(p.hoverWall);
    topInkMat.uniforms.uColor.value.set(p.ink);
    underMat.uniforms.uColor.value.set(p.under);
    underMat.uniforms.uOpacity.value = p.underA;
    underMat.blending = p.additive ? THREE.AdditiveBlending : THREE.NormalBlending;
    underMat.needsUpdate = true;
    baseInkMat.uniforms.uColor.value.set(p.edge);
    baseInkMat.uniforms.uOpacity.value = state.inverted ? 0.35 : 0.40;
    [laneMat, laneGlowMat].forEach(function (m) {
      m.uniforms.uGhost.value.set(p.ghost);
      m.uniforms.uInk.value.set(p.hot);
      m.uniforms.uHot.value.set(p.hot);
      m.uniforms.uGlowA.value = p.glowA;
      m.blending = p.additive ? THREE.AdditiveBlending : THREE.NormalBlending;
      m.needsUpdate = true;
    });
    markerMat.uniforms.uInk.value.set(p.marker);
    markerMat.uniforms.uPaper.value.set(p.additive ? p.paper : p.land);
    markerMat.blending = p.additive ? THREE.AdditiveBlending : THREE.NormalBlending;
    markerMat.needsUpdate = true;
  }

  function setNight(on) {
    state.inverted = on;
    document.body.classList.toggle('inv', on);
    paint();
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') focusHub(null);
    if (e.key === 'r' || e.key === 'R') reset();
    if (e.key === 'n' || e.key === 'N') { state.manual = true; setNight(!state.inverted); }
  });

  /* ------------------------------------------------------------------ loop */

  const proj = new THREE.Vector3();
  let last = performance.now(), tSec = 0;

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (state.motion) tSec += dt;
    applyCamera();
    laneMat.uniforms.uTime.value = tSec;
    laneGlowMat.uniforms.uTime.value = tSec;
    underMat.uniforms.uTime.value = tSec;
    markerMat.uniforms.uTime.value = tSec;

    const w = stage.clientWidth, h = stage.clientHeight;
    const sc = clamp(view.fit / view.r, 0.8, 1.35);
    for (let i = 0; i < markers.length; i++) {
      const m = markers[i];
      proj.copy(m.pos).project(camera);
      const x = (proj.x * 0.5 + 0.5) * w, y = (-proj.y * 0.5 + 0.5) * h;
      const vis = proj.z < 1 && x > -80 && x < w + 80 && y > -40 && y < h + 40;
      screen[i].x = x; screen[i].y = y; screen[i].vis = vis;
      if (!m.el || !state.labels) continue;
      if (m.shown !== vis) { m.el.style.opacity = vis ? '' : '0'; m.shown = vis; }
      if (!vis) continue;
      const flip = x > w - 130;
      if (m.flip !== flip) { m.el.classList.toggle('flip', flip); m.flip = flip; }
      m.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)' +
        (flip ? ' translateX(-100%)' : '') + ' scale(' + sc.toFixed(3) + ')';
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    aspectRatio = w / h;
    RES.set(w, h);
    const halfW = (bounds.maxX - bounds.minX) / 2 + 8;
    const halfZ = (bounds.maxZ - bounds.minZ) / 2 + 8;
    const wasFull = Math.abs(view.tr - view.fit) < 1;
    view.fit = Math.max(halfW / aspectRatio, halfZ);
    if (wasFull || !state.focus) view.tr = view.fit;
  }
  window.addEventListener('resize', resize);

  MAP_MID_X = (bounds.minX + bounds.maxX) / 2;
  MAP_MID_Z = (bounds.minZ + bounds.maxZ) / 2;
  view.target.set(MAP_MID_X, 0, MAP_MID_Z);
  view.ttarget.set(MAP_MID_X, 0, MAP_MID_Z);
  setNight(state.inverted);
  resize();
  view.r = view.fit * 1.25;
  view.tr = view.fit;
  refresh();
  applyCamera();
  requestAnimationFrame(tick);
  document.body.classList.add('ready');
})();

</script>
</body>
</html>
